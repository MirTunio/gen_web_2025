		  <span class="lightbox-arrow left" onclick="prevImage()">&#10094;</span>

		<script>
	  // Select both gallery and inline images
	  const allImages = Array.from(document.querySelectorAll('.gallery img, .inline-images img'));
	  let currentIndex = 0;

	  function openLightbox(src) {
		currentIndex = allImages.findIndex(img => img.src === src);
		document.getElementById('lightbox-img').src = src;
		document.getElementById('lightbox').classList.add('active');
	  }

	  function closeLightbox() {
		document.getElementById('lightbox').classList.remove('active');
	  }

	  function nextImage() {
		currentIndex = (currentIndex + 1) % allImages.length;
		document.getElementById('lightbox-img').src = allImages[currentIndex].src;
	  }

	  function prevImage() {
		currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
		document.getElementById('lightbox-img').src = allImages[currentIndex].src;
	  }

	  // Attach click events to all images
	  allImages.forEach(img => {
		img.addEventListener('click', () => openLightbox(img.src));
	  });

	  // Close lightbox on Escape key
	  document.addEventListener('keydown', (e) => {
		const lightbox = document.getElementById('lightbox');
		if (!lightbox.classList.contains('active')) return;
		if (e.key === "Escape") closeLightbox();
		if (e.key === "ArrowRight") nextImage();
		if (e.key === "ArrowLeft") prevImage();
	  });
	</script>


		<!-- Sizes the sketch to its canvas's own aspect ratio: as wide as possible while fitting entirely on screen -->
		<script>
		  (function(){
			const wrapper = document.getElementById('iframe-wrapper');
			const iframe  = document.getElementById('sketch-iframe');

			const SIDE_MARGIN = 16;  // px gap from left/right screen edges
			const VERT_MARGIN = 16;  // px gap from top/bottom screen edges

			let aspect = null;        // canvas width / height
			let watchedCanvas = null;

			function fit(){
			  const availW = document.documentElement.clientWidth - 2 * SIDE_MARGIN;
			  const availH = window.innerHeight - 2 * VERT_MARGIN;
			  let w, h;
			  if (aspect) {
				w = Math.min(availW, availH * aspect);
				h = w / aspect;
			  } else {
				w = availW;
				h = availH * 0.6;
			  }
			  wrapper.style.width  = Math.floor(w) + 'px';
			  wrapper.style.height = Math.floor(h) + 'px';
			}

			function injectStyle(doc){
			  if (doc.getElementById('bd-fit-style')) return;
			  const st = doc.createElement('style');
			  st.id = 'bd-fit-style';
			  // Kill the sketch page's black background and stretch the canvas to fill the frame
			  st.textContent =
				'html,body{margin:0!important;padding:0!important;overflow:hidden!important;background:transparent!important;}' +
				'canvas{display:block!important;width:100%!important;height:auto!important;max-width:none!important;max-height:none!important;}';
			  (doc.head || doc.documentElement).appendChild(st);
			}

			// The sketch page may wrap the canvas in a fixed-width box (e.g. max-width: 900px).
			// Force the canvas and every wrapper around it to fill the frame.
			function forceFill(canvas){
			  const doc = canvas.ownerDocument;
			  const set = (el, prop, val) => {
				if (el.style.getPropertyValue(prop) !== val || el.style.getPropertyPriority(prop) !== 'important') {
				  el.style.setProperty(prop, val, 'important');
				}
			  };
			  set(canvas, 'display', 'block');
			  set(canvas, 'width', '100%');
			  set(canvas, 'height', 'auto');
			  set(canvas, 'max-width', 'none');
			  set(canvas, 'max-height', 'none');
			  let el = canvas.parentElement;
			  while (el && el !== doc.body && el !== doc.documentElement) {
				set(el, 'width', '100%');
				set(el, 'max-width', 'none');
				set(el, 'margin', '0');
				set(el, 'padding', '0');
				set(el, 'box-sizing', 'border-box');
				el = el.parentElement;
			  }
			}

			function readAspect(canvas){
			  const cw = canvas.width, ch = canvas.height;   // intrinsic size, unaffected by CSS
			  if (cw > 0 && ch > 0) {
				const a = cw / ch;
				if (!aspect || Math.abs(a - aspect) > 0.001) { aspect = a; fit(); }
			  }
			}

			function hook(){
			  let doc;
			  try { doc = iframe.contentDocument; } catch (e) { return; } // cross-origin: nothing we can do
			  if (!doc || !doc.body) return;
			  injectStyle(doc);
			  const canvas = doc.querySelector('canvas');
			  if (!canvas) return;
			  if (canvas !== watchedCanvas) {
				watchedCanvas = canvas;
				// Re-fit if the sketch ever resizes its canvas (e.g. p5 resizeCanvas)
				new MutationObserver(() => { forceFill(canvas); readAspect(canvas); })
				  .observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });
			  }
			  forceFill(canvas);
			  readAspect(canvas);
			}

			iframe.addEventListener('load', function(){
			  watchedCanvas = null;
			  hook();
			  // The canvas may be created a bit after load (e.g. in p5's setup), so check for a few seconds
			  let tries = 0;
			  const t = setInterval(() => { hook(); if (++tries >= 20) clearInterval(t); }, 250);
			});

			window.addEventListener('resize', fit);
			window.addEventListener('orientationchange', fit);

			fit();
			hook();
		  })();
		</script>
