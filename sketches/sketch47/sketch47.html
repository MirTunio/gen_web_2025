<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Base path setup -->
  <script>
    const base = document.createElement("base");
    if (window.location.hostname.includes("github.io")) {
      base.href = "/gen_web_2025/";
    } else {
      base.href = "/";
    }
    document.head.prepend(base);
  </script>

  <link rel="icon" href="assets/images/favicon.jpg" type="image/jpeg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burning Daylight</title>

  <style>
    /* ---- full bleed: no margins, no scrollbars, no frame ---------------- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar { display: none; }

    #sketch-frame {
      position: fixed;
      inset: 0;              /* pinned to all four edges */
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
      z-index: 0;
    }

    /* ---- top bar: invisible until a link is hovered --------------------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25em;
      box-sizing: border-box;
      font-family: monospace;
      line-height: 1.6;

      /* the bar itself never eats a click — only the links below do */
      pointer-events: none;
    }

    header h1 { font-size: 1.5em; margin: 0; }

    header a,
    header .nav-toggle {
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.25s ease;
      text-decoration: none;
      color: #f2f2f2;
      text-shadow: 0 0 0.5em rgba(0, 0, 0, 0.9);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    header a:hover,
    header a:focus-visible,
    header .nav-toggle:hover,
    header .nav-toggle:focus-visible { opacity: 1; }

    /* Want the whole bar to fade in when the pointer reaches the top strip,
       instead of one link at a time? Uncomment this:
    header:hover a, header:hover .nav-toggle { opacity: 1; }
    */

    nav a { font-size: 1.1em; margin-left: 1.25em; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; }

    .nav-toggle { display: none; font-size: 1.5em; }

    /* ---- touch devices: no hover exists, so ☰ stays faintly visible ----- */
    @media (hover: none) {
      .nav-toggle { display: block; opacity: 0.35; }
      .nav-links a { opacity: 0; }
      .nav-links.active a { opacity: 1; }
    }

    @media (max-width: 37.5em) {
      .nav-toggle { display: block; }
      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 0.5em;
        align-items: flex-end;
      }
      .nav-links.active { display: flex; }
      .nav-links a { margin: 0.3125em 0; font-size: 1.1em; text-align: right; }
      header { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      header a, header .nav-toggle { transition: none; }
    }
  </style>
</head>

<body>
  <header>
    <h1><a class="title-link" href="index.html">Burning Daylight</a></h1>
    <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    <nav class="nav-links">
      <a href="index.html">genart</a>
      <a href="fiction.html">fiction</a>
      <a href="nonfiction.html">nonfiction</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </nav>
  </header>

  <!-- START: sketch display portion -->
  <iframe id="sketch-frame"
          src="sketches/sketch47/src/index.html"
          scrolling="no"
          allowfullscreen
          title="sketch 47"></iframe>
  <!-- END: sketch display portion -->

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => nav.classList.toggle('active'));
  </script>
</body>
</html>
